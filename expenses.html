<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Gastos</title>
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <!-- Contenedor principal -->
    <div class="container">
      <!-- Barra de navegación -->
      <nav class="navbar">
        <ul>
          <li><a href="categories.html" id="categoriesLink">Categorías</a></li>
          <li><a href="expenses.html" id="expensesLink">Gastos</a></li>
          <li><a href="#" id="logout">Cerrar sesión</a></li>
        </ul>
      </nav>
      <h1>Gestión de Gastos</h1>

      <!-- Formulario de gastos -->
      <div class="form-container">
        <form id="expenseForm">
          <input type="hidden" id="expenseId" value="" />
          <!-- Campo oculto para el ID -->

          <label for="expenseTitle">Título del gasto:</label>
          <input
            type="text"
            id="expenseTitle"
            placeholder="Escribe el título"
            required
          />

          <label for="expenseAmount">Monto:</label>
          <input
            type="number"
            id="expenseAmount"
            placeholder="Escribe el monto"
            required
          />

          <label for="expenseCategory">Categoría:</label>
          <select id="expenseCategory" required>
            <option value="">Selecciona una categoría</option>
            <option value="Hogar">Hogar</option>
            <option value="Estudios">Estudios</option>
            <option value="Alimentación">Alimentación</option>
            <option value="Transporte">Transporte</option>
          </select>

          <label for="expenseDate">Fecha:</label>
          <input type="date" id="expenseDate" />

          <div class="buttons">
            <button type="button" id="saveExpense">Guardar</button>
            <button type="button" id="updateExpense" style="display: none">
              Actualizar
            </button>
            <button type="button" id="cancelUpdate" style="display: none">
              Cancelar
            </button>
          </div>
        </form>
      </div>

      <!-- Listado de gastos -->
      <div class="list-container">
        <h2>Gastos registrados</h2>
        <ul id="expenseList">
          <!-- Aquí se agregarán dinámicamente los gastos -->
        </ul>
      </div>
    </div>

    <!-- Lógica del Frontend Integrada (Punto 2 de la guía) -->
    <script>
      const API_URL = "http://localhost:3000/api/gastos";

      // Elementos de la interfaz
      const expenseList = document.getElementById("expenseList");
      const expenseForm = document.getElementById("expenseForm");
      const expenseId = document.getElementById("expenseId");
      const expenseTitle = document.getElementById("expenseTitle");
      const expenseAmount = document.getElementById("expenseAmount");
      const expenseCategory = document.getElementById("expenseCategory");
      const expenseDate = document.getElementById("expenseDate");

      // Botones de acción
      const btnSave = document.getElementById("saveExpense");
      const btnUpdate = document.getElementById("updateExpense");
      const btnCancel = document.getElementById("cancelUpdate");

      // Ejecutar funciones al cargar la ventana
      document.addEventListener("DOMContentLoaded", () => {
        cargarGastos();

        // Eventos de los botones de interacción
        btnSave.addEventListener("click", crearGasto);
        btnUpdate.addEventListener("click", guardarCambiosActualizacion);
        btnCancel.addEventListener("click", limpiarFormulario);
      });

      // 1. FUNCIÓN PARA LISTAR GASTOS
      function cargarGastos() {
        fetch(API_URL)
          .then((respuesta) => respuesta.json())
          .then((datos) => {
            expenseList.innerHTML = "";
            datos.forEach((gasto) => {
              const li = document.createElement("li");
              li.style.marginBottom = "10px";
              li.innerHTML = `
                            <strong>${gasto.descripcion}</strong> - $${gasto.monto} [${gasto.categoria}]
                            <span style="margin-left: 15px;">
                                <button onclick="prepararEdicion(${gasto.id}, '${gasto.descripcion}', ${gasto.monto}, '${gasto.categoria}')">Editar</button>
                                <button onclick="eliminarGasto(${gasto.id})">Eliminar</button>
                            </span>
                        `;
              expenseList.appendChild(li);
            });
          })
          .catch((error) => console.error("Error al listar registros:", error));
      }

      // FUNCIÓN AUXILIAR PARA CREAR (Se ejecuta con el botón Guardar)
      function crearGasto() {
        if (
          !expenseTitle.value ||
          !expenseAmount.value ||
          !expenseCategory.value
        ) {
          alert("Por favor complete los campos obligatorios");
          return;
        }

        const nuevoGasto = {
          descripcion: expenseTitle.value,
          monto: expenseAmount.value,
          categoria: expenseCategory.value,
        };

        fetch(API_URL, {
          method: "POST", // Nota: Asegúrate de tener esta ruta si implementas creación en backend
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(nuevoGasto),
        })
          .then(() => {
            limpiarFormulario();
            cargarGastos();
          })
          .catch((error) => console.error("Error al guardar:", error));
      }

      // 2. FUNCIÓN PARA ELIMINAR GASTO
      function eliminarGasto(id) {
        if (confirm("¿Está seguro de que desea eliminar este gasto?")) {
          fetch(`${API_URL}/${id}`, {
            method: "DELETE",
          })
            .then((respuesta) => respuesta.json())
            .then(() => {
              cargarGastos(); // Refresca el listado de inmediato
            })
            .catch((error) => console.error("Error al eliminar:", error));
        }
      }

      // 3. FUNCIONES PARA ACTUALIZAR GASTO
      function prepararEdicion(id, descripcion, monto, categoria) {
        // Mapea los valores al formulario original del profesor
        expenseId.value = id;
        expenseTitle.value = descripcion;
        expenseAmount.value = monto;
        expenseCategory.value = categoria;

        // Gestión de visibilidad de botones originales
        btnSave.style.display = "none";
        btnUpdate.style.display = "inline-block";
        btnCancel.style.display = "inline-block";
      }

      function guardarCambiosActualizacion() {
        const id = expenseId.value;
        const datosActualizados = {
          descripcion: expenseTitle.value,
          monto: expenseAmount.value,
          categoria: expenseCategory.value,
        };

        fetch(`${API_URL}/${id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(datosActualizados),
        })
          .then((respuesta) => respuesta.json())
          .then(() => {
            limpiarFormulario();
            cargarGastos(); // Refresca el listado de inmediato
          })
          .catch((error) => console.error("Error al actualizar:", error));
      }

      function limpiarFormulario() {
        expenseForm.reset();
        expenseId.value = "";

        // Restablece el estado de los botones a su modo inicial
        btnSave.style.display = "inline-block";
        btnUpdate.style.display = "none";
        btnCancel.style.display = "none";
      }
    </script>
    <script src="src/main.js" type="module"></script>
  </body>
</html>
